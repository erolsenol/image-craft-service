replicaCount: 2

image:
  repository: ghcr.io/erolsenol/image-craft-service
  tag: "1.2.0"
  pullPolicy: IfNotPresent

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

redis:
  existingSecret: image-craft-secrets
  secretKey: REDIS_URL

service:
  type: ClusterIP
  port: 80

existingSecret: image-craft-secrets

env:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  STORAGE_DRIVER: s3
  S3_ENDPOINT: https://s3.example.com
  S3_REGION: us-east-1
  S3_BUCKET: image-craft
  S3_FORCE_PATH_STYLE: "true"
  IMAGE_PROCESSING_CONCURRENCY: "2"
  SHARP_CONCURRENCY: "2"
  SHARP_CACHE_MEMORY_MB: "32"
  CACHE_MAX_AGE_SECONDS: "86400"
  CACHE_DISTRIBUTED_LOCK_ENABLED: "true"
  CACHE_DISTRIBUTED_LOCK_TTL_MS: "10000"
  CACHE_DISTRIBUTED_LOCK_WAIT_MS: "15000"
  NAMED_SOURCES: "{}"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

terminationGracePeriodSeconds: 45
