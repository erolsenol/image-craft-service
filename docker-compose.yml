services:
  image-craft-service:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      CACHE_DIR: /var/cache/image-craft
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      REMOVE_BACKGROUND_ENABLED: ${REMOVE_BACKGROUND_ENABLED:-false}
      REMBG_URL: http://rembg:7000
    volumes:
      - image-cache:/var/cache/image-craft
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rembg:
    image: danielgatis/rembg:2.0.85
    profiles: [plugins]
    command: ["s", "--host", "0.0.0.0", "--port", "7000", "--no-ui"]
    volumes:
      - rembg-models:/root/.rembg
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - image-craft-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-dev-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/image-craft-service.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  image-cache:
  redis-data:
  rembg-models:
  prometheus-data:
  grafana-data:
