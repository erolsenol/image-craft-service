services:
  image-craft-service:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      CACHE_DIR: /var/cache/image-craft
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      REMOVE_BACKGROUND_ENABLED: ${REMOVE_BACKGROUND_ENABLED:-false}
      REMBG_URL: http://rembg:7000
    volumes:
      - image-cache:/var/cache/image-craft
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  redis:
    image: redis:7-alpine
    profiles: [queue]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rembg:
    image: danielgatis/rembg:2.0.85
    profiles: [plugins]
    command: ["s", "--host", "0.0.0.0", "--port", "7000", "--no-ui"]
    volumes:
      - rembg-models:/root/.rembg
    restart: unless-stopped

volumes:
  image-cache:
  redis-data:
  rembg-models:
