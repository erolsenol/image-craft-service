services:
  image-craft-service:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      CACHE_DIR: /var/cache/image-craft
      STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGNED_UPLOAD_TTL_SECONDS: ${S3_PRESIGNED_UPLOAD_TTL_SECONDS:-900}
      NAMED_SOURCES: ${NAMED_SOURCES:-}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      REMOVE_BACKGROUND_ENABLED: ${REMOVE_BACKGROUND_ENABLED:-false}
      REMBG_URL: http://rembg:7000
    volumes:
      - image-cache:/var/cache/image-craft
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rembg:
    image: danielgatis/rembg:2.0.85
    profiles: [plugins]
    command: ["s", "--host", "0.0.0.0", "--port", "7000", "--no-ui"]
    volumes:
      - rembg-models:/root/.rembg
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [s3-test]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  s3-integration:
    build:
      context: .
      target: build
    profiles: [s3-test]
    command: ["npm", "test", "--", "test/integration/s3-storage.test.ts"]
    environment:
      S3_TEST_ENDPOINT: http://minio:9000
      S3_TEST_REGION: us-east-1
      S3_TEST_ACCESS_KEY: minioadmin
      S3_TEST_SECRET_KEY: minioadmin
    depends_on:
      minio:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - image-craft-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-dev-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/image-craft-service.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  image-cache:
  redis-data:
  rembg-models:
  prometheus-data:
  grafana-data:
  minio-data:
