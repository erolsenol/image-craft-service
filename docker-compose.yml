services:
  image-craft-service:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      CACHE_DIR: /var/cache/image-craft
    volumes:
      - image-cache:/var/cache/image-craft
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

volumes:
  image-cache:
