[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-craft-client"
version = "1.2.1"
description = "Python SDK for image-craft-service"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "image-craft-service contributors" }]
keywords = ["image", "image-processing", "sdk"]

[tool.setuptools]
packages = ["image_craft_client"]
