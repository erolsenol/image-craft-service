name: Publish SDKs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v1 release tag to publish
        required: true
        type: string
permissions:
  contents: read
  id-token: write
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
jobs:
  service:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v1.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Normalize repository metadata for existing release packages
        run: npm pkg set repository.type=git repository.url=git+https://github.com/erolsenol/image-craft-service.git
      - name: Publish service package if this version is not already on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Service version $VERSION does not match release $RELEASE_VERSION"
            exit 1
          fi
          if npm view "image-craft-service@$VERSION" version >/dev/null 2>&1; then
            echo "image-craft-service@$VERSION is already published"
          else
            npm publish --access public --provenance
          fi
  npm:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v1.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run sdk:generate
      - run: npm run client:build
      - name: Publish if this version is not already on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Client version $VERSION does not match release $RELEASE_VERSION"
            exit 1
          fi
          if npm view "image-craft-client@$VERSION" version >/dev/null 2>&1; then
            echo "image-craft-client@$VERSION is already published"
          else
            npm publish --access public --provenance
          fi
        working-directory: packages/client
  pypi:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v1.')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/image-craft-client
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install build
      - run: python -m build packages/python
      - name: Check package version matches release tag
        working-directory: packages/python
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Python SDK version $VERSION does not match release $RELEASE_VERSION"
            exit 1
          fi
      - name: Check whether this version is already on PyPI
        id: pypi-version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml', 'rb'))['project']['version'])")
          PYPI_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/image-craft-client/$VERSION/json")
          if [[ "$PYPI_STATUS" == "200" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$PYPI_STATUS" == "404" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected PyPI status: $PYPI_STATUS"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi-version.outputs.exists != 'true'
        with:
          packages-dir: packages/python/dist
