name: Publish SDKs
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    if: startsWith(github.event.release.tag_name, 'v0.9.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run sdk:generate
      - run: npm run client:build
      - name: Publish if this version is not already on npm
        run: |
          if npm view image-craft-client@0.9.0 version >/dev/null 2>&1; then
            echo "image-craft-client@0.9.0 is already published"
          else
            npm publish --access public --provenance
          fi
        working-directory: packages/client
  pypi:
    if: startsWith(github.event.release.tag_name, 'v0.9.')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/image-craft-client
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install build
      - run: python -m build packages/python
      - name: Check whether this version is already on PyPI
        id: pypi-version
        run: |
          PYPI_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' https://pypi.org/pypi/image-craft-client/0.9.0/json)
          if [[ "$PYPI_STATUS" == "200" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$PYPI_STATUS" == "404" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected PyPI status: $PYPI_STATUS"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi-version.outputs.exists != 'true'
        with:
          packages-dir: packages/python/dist
