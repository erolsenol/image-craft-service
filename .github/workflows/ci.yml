name: CI
on:
  push:
    branches: [master, main, development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_REGION: us-east-1
      S3_TEST_ACCESS_KEY: minioadmin
      S3_TEST_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - run: npm run sdk:generate
      - run: git diff --exit-code -- openapi/openapi.json packages/client/src/generated.ts packages/python/image_craft_client/_openapi.py
      - run: npm run client:build
      - run: npm run docs:build
      - run: docker run --detach --rm --name image-craft-minio --publish 9000:9000 --env MINIO_ROOT_USER=minioadmin --env MINIO_ROOT_PASSWORD=minioadmin docker.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68 server /data
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: python3 -m unittest discover -s packages/python/tests
      - run: python3 -m unittest discover -s workers/pdf-rasterizer/tests
      - run: python3 -m pip install build
      - run: python3 -m build packages/python
      - run: docker build -t image-craft-service:ci .
      - run: docker build -t image-craft-ai-worker:ci ./workers/ai-http-worker
      - run: docker build -t image-craft-pdf-worker:ci ./workers/pdf-rasterizer
