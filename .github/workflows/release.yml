name: Release images
on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  container:
    if: startsWith(github.event.release.tag_name, 'v1.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3.8.1
      - name: Sign container digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: anchore/sbom-action/download-syft@v0.17.9
      - name: Attach SPDX SBOM to signed image and release
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          syft "$IMAGE@$DIGEST" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
          gh release upload "$GITHUB_REF_NAME" sbom.spdx.json --clobber
      - name: Add release build details
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.md
          {
            printf '\n'
            printf '\n### Container images\n\n'
            printf -- '- Multi-architecture: `%s:%s` (`linux/amd64`, `linux/arm64`)\n' "$IMAGE" "$GITHUB_REF_NAME"
            printf -- '- Immutable digest: `%s@%s`\n' "$IMAGE" "$DIGEST"
            printf -- '- Cosign keyless signature and SPDX SBOM attached.\n'
          } >> release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
